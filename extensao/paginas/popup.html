<!doctype html><html lang=pt-BR><meta charset=utf-8><title>Clipper</title>
<script src="../comum/tema-inicial.js"></script>
<link rel=stylesheet href="../comum/base.css">
<style>
html,body{height:auto}
body{width:300px}
.cab{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--borda);background:var(--sup)}
.cab img{width:22px;height:22px}
.cab b{font-size:14px}
.st{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mut)}
.st i{width:8px;height:8px;border-radius:50%;background:var(--borda2)}
.st.on{color:var(--bug)}.st.on i{background:var(--bug);animation:pisca 1.4s infinite}
.lista{display:flex;flex-direction:column;gap:6px;padding:12px}
.lista .btn{justify-content:flex-start;height:38px;font-size:13px}
.lista .btn svg{width:17px;height:17px;color:var(--pri)}
.lista .btn kbd{margin-left:auto}
.dica{padding:0 14px 12px;color:var(--mut);font-size:11.5px;line-height:1.5}
</style>
<body>
<div class=cab><img src="../icones/clipper-32.png" alt=""><b>Clipper</b><span class=st id=st><i></i><span id=stt>Parado</span></span></div>
<div class=lista>
 <button class="btn" data-acao=print><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx=12 cy=13 r=3 /></svg>Tirar print<kbd data-k=print hidden></kbd></button>
 <button class="btn" data-acao=selecao><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M5 3a2 2 0 0 0-2 2M19 3a2 2 0 0 1 2 2M21 19a2 2 0 0 1-2 2M5 21a2 2 0 0 1-2-2M9 3h1M9 21h1M14 3h1M14 21h1M3 9v1M21 9v1M3 14v1M21 14v1"/></svg>Print com seleção<kbd data-k=selecao hidden></kbd></button>
 <button class="btn" data-acao=clipe id=bclip disabled><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>Salvar clipe<kbd data-k=clipe hidden></kbd></button>
 <button class="btn" data-acao=trim><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round><circle cx=6 cy=6 r=3 /><circle cx=6 cy=18 r=3 /><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg>Abrir trim</button>
 <button class="btn pri" data-acao=painel id=bpainel>Abrir o Clipper</button>
</div>
<div class=dica id=dica>O print é sempre da tela inteira. Sem gravação, o navegador pergunta qual tela.</div>
<script type=module src="popup.js"></script>
