<!doctype html><html lang=pt-BR><meta charset=utf-8><title>Print com seleção · Clipper</title>
<link rel=icon href="../icones/clipper-32.png">
<script src="../comum/tema-inicial.js"></script>
<link rel=stylesheet href="../comum/base.css">
<style>
html,body{background:#000;overflow:hidden;user-select:none}
#cv{position:fixed;inset:0;cursor:crosshair}
.tip{position:fixed;left:50%;top:22px;transform:translateX(-50%);background:var(--sup);color:var(--txt);border:1px solid var(--borda);border-radius:10px;
 padding:9px 14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;pointer-events:none}
.tip svg{width:16px;height:16px;color:var(--bug)}
#dims{position:fixed;background:var(--pri);color:var(--pri-txt);font:700 11px ui-monospace,Consolas,monospace;padding:2px 6px;border-radius:5px;pointer-events:none}
#bar{position:fixed;display:flex;align-items:center;gap:4px;padding:6px;background:var(--sup);border:1px solid var(--borda);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.4)}
.tb{width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:none;color:var(--txt2);display:grid;place-items:center;cursor:pointer;padding:0}
.tb:hover{background:var(--sup2);border-color:var(--borda)}
.tb.on{background:var(--pri-cx);border-color:var(--pri-cx-b);color:var(--pri)}
.tb svg{width:17px;height:17px}
.dv{width:1px;height:22px;background:var(--borda);margin:0 4px}
.cor{width:20px;height:20px;border-radius:50%;border:2px solid var(--sup);box-shadow:0 0 0 1px var(--borda2);cursor:pointer;padding:0;margin:0 2px}
.cor.on{box-shadow:0 0 0 2px var(--pri)}
.sz{width:28px;height:32px;border-radius:8px;border:1px solid transparent;background:none;display:grid;place-items:center;cursor:pointer;padding:0}
.sz i{display:block;border-radius:50%;background:var(--txt2)}
.sz:hover{background:var(--sup2)}.sz.on{background:var(--pri-cx);border-color:var(--pri-cx-b)}.sz.on i{background:var(--pri)}
#bar .btn{height:32px}
#txt{position:fixed;min-width:140px;height:auto;padding:2px 6px;background:rgba(255,255,255,.92);color:#111;border:2px dashed var(--pri);border-radius:6px;font-weight:700;outline:none}
</style>
<body>
<canvas id=cv></canvas>
<div class=tip id=tip><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg><span>Arraste para selecionar a área · <kbd>Esc</kbd> cancela</span></div>
<div id=dims hidden></div>
<input id=txt hidden>
<div id=bar hidden>
 <button class="tb on" data-t=pen title="Caneta (P)"><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M12 20h9"/><path d="M16.38 3.62a1 1 0 0 1 3 3L7.37 18.64a2 2 0 0 1-.86.5l-2.87.84a.5.5 0 0 1-.62-.62l.84-2.87a2 2 0 0 1 .5-.86z"/></svg></button>
 <button class=tb data-t=mark title="Marca-texto (M)"><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg></button>
 <button class=tb data-t=arrow title="Seta (A)"><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M7 17 17 7M8 7h9v9"/></svg></button>
 <button class=tb data-t=rect title="Retângulo (R)"><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><rect x=3 y=5 width=18 height=14 rx=2 /></svg></button>
 <button class=tb data-t=text title="Texto (T)"><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M4 7V5h16v2M9 19h6M12 5v14"/></svg></button>
 <button class=tb data-t=blur title="Pixelar · esconde dados sensíveis (B)"><svg viewBox="0 0 24 24" fill=currentColor><rect x=3 y=3 width=5 height=5 rx=1 /><rect x=10 y=3 width=5 height=5 rx=1 opacity=.5 /><rect x=17 y=3 width=4 height=5 rx=1 /><rect x=3 y=10 width=5 height=5 rx=1 opacity=.5 /><rect x=10 y=10 width=5 height=5 rx=1 /><rect x=17 y=10 width=4 height=5 rx=1 opacity=.5 /><rect x=3 y=17 width=5 height=4 rx=1 /><rect x=10 y=17 width=5 height=4 rx=1 opacity=.5 /><rect x=17 y=17 width=4 height=4 rx=1 /></svg></button>
 <span class=dv></span>
 <span id=cores></span>
 <span class=dv></span>
 <button class=sz data-s=1 title="Fina"><i style="width:5px;height:5px"></i></button>
 <button class="sz on" data-s=2 title="Média"><i style="width:9px;height:9px"></i></button>
 <button class=sz data-s=3 title="Grossa"><i style="width:13px;height:13px"></i></button>
 <span class=dv></span>
 <button class=tb id=undo title="Desfazer (Ctrl+Z)"><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
 <button class=tb id=resel title="Selecionar outra área"><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M5 3a2 2 0 0 0-2 2M19 3a2 2 0 0 1 2 2M21 19a2 2 0 0 1-2 2M5 21a2 2 0 0 1-2-2M9 3h1M9 21h1M14 3h1M14 21h1M3 9v1M21 9v1M3 14v1M21 14v1"/></svg></button>
 <span class=dv></span>
 <button class=btn id=cancel title="Cancelar (Esc)">Cancelar</button>
 <button class="btn pri" id=save title="Escolher o nome e salvar (Enter)">Salvar…</button>
</div>
<script type=module src="selecao.js"></script>
